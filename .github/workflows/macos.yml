name: StudHub macOS universal installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
      - name: Verify both architectures and bundled modpack
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/StudHub Launcher.app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/studhub-launcher"
          codesign --verify --deep --strict "$app"
          cmp src-tauri/resources/studhub-pack-1.0.2.zip "$app/Contents/Resources/resources/studhub-pack-1.0.2.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StudHubLauncher-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
