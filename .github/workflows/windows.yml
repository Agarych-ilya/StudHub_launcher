name: Build StudHub Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'tools/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and modpack
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify original launcher source and modpack
        shell: pwsh
        run: |
          if (!(Test-Path 'package-lock.json')) { throw 'Upload original launcher source files before building.' }
          $file = 'src-tauri/resources/studhub-pack-1.0.2.zip'
          if (!(Test-Path $file)) { throw "Missing original modpack: $file" }
          $size = (Get-Item $file).Length
          if ($size -ne 187653771) { throw "Modpack size $size incorrect; ensure git lfs was used." }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies and test updater frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate native launcher
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native Windows NSIS EXE
        run: npm run tauri build -- --bundles nsis
      - name: Verify setup EXE exists
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop)
          if ($exes.Count -lt 1) { throw 'No NSIS executable generated' }
          foreach ($exe in $exes) {
            Write-Output "Output: $($exe.Name) ($($exe.Length) bytes)"
            if ($exe.Length -lt 100MB) { throw 'Installer unexpectedly small: missing embedded modpack?' }
            Get-FileHash -Algorithm SHA256 $exe.FullName
          }
      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: StudHubLauncher-Windows-Setup-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish EXE in GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
